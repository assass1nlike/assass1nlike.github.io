name: Supabase keepalive

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST endpoints
        env:
          SUPABASE_URL: https://afhzpxkbudtsofxwktci.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_jsLUI42WJb7AUd9vKk7i1Q_QnZ1CC29
        run: |
          set -euo pipefail

          headers=(
            -H "apikey: ${SUPABASE_ANON_KEY}"
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
            -H "Accept: application/json"
            -H "Cache-Control: no-cache"
          )

          curl -fsS "${headers[@]}" "${SUPABASE_URL}/rest/v1/guestbook_messages?select=id&limit=1" \
            || curl -fsS "${headers[@]}" "${SUPABASE_URL}/rest/v1/secret_messages?select=id&limit=1" \
            || curl -fsS -H "apikey: ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/auth/v1/settings"
