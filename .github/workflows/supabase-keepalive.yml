name: Supabase keepalive

# Free-tier Supabase projects are paused after a stretch without activity.
# Reading one public guestbook row every three days keeps the guestbook project awake.

on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one public guestbook message
        env:
          SUPABASE_URL: https://myrhtqbjnkxqaniuivzm.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_e0WjGdoi8kz7Acb3xV_u0Q_KmbeXH-Z
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-delay 10 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/guestbook_messages?select=id&limit=1"
