# 提交用的 GitHub 账号（gh 已登录）
account = "assass1nlike"
# 访问 GitHub 用的代理（git、gh、worker 都走它）；留空则直连
proxy = "http://127.0.0.1:7890"

# commit 用的身份
git_name = "assass1nlike"
git_email = "326038984+assass1nlike@users.noreply.github.com"

# 干活的 headless Claude Code（接口地址和 key 在 .env）
model = "claude-opus-5-5"
effort = "high"

# 重型工作区：repo clone、worktree、venv。Windows 没开长路径，路径必须短
workspace = "D:/ag"

# 每个任务的时间上限（秒）
work_timeout = 5400
review_timeout = 2400

# 质量关卡：reviewer 打分 1-10，低于此分不提交；最多按审稿意见修改几轮
min_review_score = 8
max_revisions = 2

# 提交节奏（跨多次运行生效）：最近 24 小时最多提交几个，同一 repo 同时最多几个我方 open PR，
# 每次提交后随机取多少秒内不再提交。间隔没到时 submit 直接返回，剩下的留给下次运行
max_submissions_per_day = 2
max_open_prs_per_repo = 1
submit_interval = [1800, 5400]

# 定时运行（python -m autogitter schedule）：每隔几小时跑一轮；
# 过审待提交的已有这么多时，本轮只提交不干活；筛选分低于此值的 issue 不修；每轮最多 hunt 几个 repo
schedule_hours = 3
max_ready_backlog = 2
min_pick_score = 5
hunts_per_run = 1

# 在 PR/issue 末尾声明由 AI agent 完成（repo 规定必须披露时，无论此项都会披露）
disclose_ai = false
disclosure = """
<sub>This contribution was prepared by an AI coding agent (Claude Code) working from @assass1nlike's account. The reproduction and tests described above were actually run by the agent.</sub>
"""

# 候选 issue 的筛选
issue_age_days = 60
max_issue_comments = 12
candidates_per_repo = 30

# 白名单只收没有反 agent 条款的 repo：禁止全自动 agent、要求真人审过每行或手写描述、
# 要求先拿到维护者批准或 assign 的都不在内（transformers、trl、peft、diffusers、keras、jax、
# scikit-learn、langchain、dspy、optuna、litellm、haystack、timm、vllm 等）。
# mlflow 要求 commit 带 Claude 的 Co-Authored-By，不投。tokenizers、safetensors、ollama 需要 Rust/Go，本机没装。

# 可以提 PR 也可以提 issue
pr_repos = [
    "huggingface/datasets",
    "huggingface/accelerate",
    "huggingface/sentence-transformers",
    "Lightning-AI/pytorch-lightning",
    "Lightning-AI/torchmetrics",
    "run-llama/llama_index",
    "pydantic/pydantic-ai",
    "567-labs/instructor",
    "mlfoundations/open_clip",
    "EleutherAI/lm-evaluation-harness",
]

# 不收外部 PR 或倾向自己修，只提 bug issue（只走 hunt）
issue_repos = [
    "huggingface/huggingface_hub",
    "gradio-app/gradio",
    "openai/openai-agents-python",
]

# 开 PR 前要先在 issue 下评论认领的 repo，值是认领评论
self_assign = { "huggingface/datasets" = "#self-assign" }
