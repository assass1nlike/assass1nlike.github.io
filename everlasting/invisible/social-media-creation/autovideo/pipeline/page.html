<!doctype html>
<html>
<head>

<style>
  @font-face { font-family: "Head"; src: url("file:///C:/Windows/Fonts/Source%20Han%20Serif%20SC%20Heavy%20(TrueType).ttf"); }

  @font-face { font-family: "BodySans"; src: url("file:///C:/Windows/Fonts/Noto%20Sans%20SC%20(TrueType).otf"); font-weight: 400; }
  @font-face { font-family: "BodySans"; src: url("file:///C:/Windows/Fonts/Noto%20Sans%20SC%20Bold%20(TrueType).otf"); font-weight: 700; }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>

<canvas id="c" width="1920" height="1080"></canvas>
