# 写作模型。api 是接口格式："anthropic"（/v1/messages）或 "openai"（/v1/chat/completions），
# 接口地址和 key 在 .env：anthropic 格式的地址不带 /v1，openai 格式的地址带 /v1
api = "anthropic"
model = "claude-sonnet-5-5"

# 发布时勾选“包含 AI 辅助创作”
declare_ai = true

# 一次 run 默认写几篇
per_run = 3

# 两次发布之间随机等待的秒数范围
publish_interval = [600, 1800]

# 问题发现：要抓的页面
sources = ["hot", "invited", "recommend"]

# 跳过关注数低于此值的问题（太冷门没人看）
min_followers = 20

# 每日任务（python -m autozhihu daily，由计划任务每天启动）
daily_count = 3
publish_window = ["10:00", "23:00"]
min_gap_minutes = 60
